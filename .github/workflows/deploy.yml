name: Build and deploy SAIG report

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pinned so that a rebuild of the same source gives the same output.
      # Change deliberately, at a release, and note it in the changelog.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - name: Verify archived versions are unchanged
        run: |
          set -euo pipefail
          for d in archive/*/; do
            echo "Checking ${d}"
            (cd "$d" && sha256sum --check --quiet SHA256SUMS)
          done

      - name: Render current version
        run: quarto render

      # Site layout:
      #   /ai-emissions/          latest version (rendered from index.qmd)
      #   /ai-emissions/<code>/   every version, frozen once superseded
      #   /ai-emissions/versions.json, version-banner.js
      - name: Assemble versioned site
        run: |
          set -euo pipefail
          rm -rf docs/archive
          latest=$(jq -r '.latest' versions.json)
          cp -R docs "${RUNNER_TEMP}/current"
          for d in archive/*/; do
            v=$(basename "$d")
            cp -R "$d" "docs/${v}"
          done
          # Until the latest version is frozen into archive/, serve the
          # current render at its permanent URL as well.
          if [ ! -d "docs/${latest}" ]; then
            cp -R "${RUNNER_TEMP}/current" "docs/${latest}"
          fi
          echo "Latest: ${latest}"
          ls docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
