<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="breakdown-title breakdown-desc">
  <title id="breakdown-title">Worked example: 207.5 tonnes carbon dioxide equivalent</title>
  <desc id="breakdown-desc">The inventory footprint is 207.5 tonnes carbon dioxide equivalent. By accounting boundary, inference is 87.4 tonnes and model development is 120.1 tonnes. By emissions source, operations are 186.2 tonnes, embodied IT is 18.1 tonnes, and data center construction is 3.2 tonnes. The two breakdowns are alternative views of the same total.</desc>
  <defs>
    <style>
      .heading{font-family:Inter,Arial,sans-serif;font-weight:500;fill:#033845}
      .body{font-family:'DM Sans',Arial,sans-serif;fill:#242424}
      .mono{font-family:'DM Mono',Menlo,monospace;fill:#4F747D;letter-spacing:.6px}
      .white{font-family:Inter,Arial,sans-serif;font-weight:500;fill:#FFFFFF}
    </style>
    <clipPath id="bar-one"><rect x="60" y="171" width="1080" height="72" rx="10"/></clipPath>
    <clipPath id="bar-two"><rect x="60" y="348" width="1080" height="72" rx="10"/></clipPath>
  </defs>
  <rect width="1200" height="530" rx="22" fill="#F5F1E9"/>
  <rect x="40" y="33" width="5" height="53" rx="2.5" fill="#B8663B"/>
  <text x="61" y="58" class="heading" font-size="29">Worked example</text>
  <text x="1140" y="58" text-anchor="end" class="heading" font-size="27">207.5 tCO₂e</text>
  <text x="61" y="84" class="body" font-size="17">Two complementary views of the same inventory footprint</text>
  <line x1="60" y1="106" x2="1140" y2="106" stroke="#C8D7DA" stroke-width="1"/>

  <text x="60" y="143" class="heading" font-size="21">By accounting boundary</text>
  <text x="1140" y="143" text-anchor="end" class="mono" font-size="13">87.4 + 120.1 = 207.5</text>
  <g clip-path="url(#bar-one)">
    <rect x="60" y="171" width="455" height="72" fill="#2B6572"/>
    <rect x="515" y="171" width="625" height="72" fill="#B8663B"/>
  </g>
  <text x="81" y="214" class="white" font-size="22">Inference  ·  87.4</text>
  <text x="537" y="214" class="white" font-size="22">Model development  ·  120.1</text>
  <text x="60" y="272" class="mono" font-size="14">42% OF TOTAL</text>
  <text x="1140" y="272" text-anchor="end" class="mono" font-size="14">58% OF TOTAL</text>

  <text x="60" y="318" class="heading" font-size="21">By emissions source</text>
  <text x="1140" y="318" text-anchor="end" class="mono" font-size="13">186.2 + 18.1 + 3.2 = 207.5</text>
  <g clip-path="url(#bar-two)">
    <rect x="60" y="348" width="969" height="72" fill="#2B6572"/>
    <rect x="1029" y="348" width="94" height="72" fill="#B8663B"/>
    <rect x="1123" y="348" width="17" height="72" fill="#55BAC0"/>
  </g>
  <text x="81" y="391" class="white" font-size="22">Operational emissions  ·  186.2</text>
  <rect x="675" y="448" width="14" height="14" rx="2" fill="#B8663B"/>
  <text x="700" y="461" class="body" font-size="17">Embodied IT  ·  18.1</text>
  <rect x="935" y="448" width="14" height="14" rx="2" fill="#55BAC0"/>
  <text x="960" y="461" class="body" font-size="17">Construction  ·  3.2</text>

  <text x="60" y="495" class="body" font-size="15" fill="#4F747D">Model development is allocated across the emissions sources; the two bars should not be added together.</text>
</svg>
